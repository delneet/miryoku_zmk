name: "Build Corne 5 nice_oled (vertical)"
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["corne_left nice_oled","corne_right nice_oled"]'
      # modules: '["mctechnology17/zmk-nice-oled/main"]'
      # The modules input is a MATRIX AXIS: each array element is one build
      # variant. Multiple modules for the same build go space-separated
      # inside a single element.
      modules: '["delneet/zmk-nice-oled/feat/more-animations delneet/zmk-peripheral-animations/main"]'
      kconfig: '["CONFIG_ZMK_KEYBOARD_NAME=\"Corne 5\""]'

      # Pin ZMK to v0.3.0: the version zmk-nice-oled was tested against, and the
      # last line before ZMK renamed nice_nano_v2 -> nice_nano (Zephyr 4.1).
      # This is what fixes the "Board not found" error.
      branches: '["zmkfirmware/zmk/v0.3.0"]'
