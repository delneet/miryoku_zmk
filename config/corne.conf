CONFIG_ZMK_SLEEP=y

# Turns the display on and hands the screen to the zmk-nice-oled module
# (which draws everything in portrait, matching a 90-degree mount).
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_HID_INDICATORS=n

CONFIG_ZMK_POINTING=y

CONFIG_NICE_OLED_ON=y
CONFIG_NICE_OLED_WIDGET_INVERTED=n

# CONFIG_ZMK_WPM=n
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=n
CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=n
CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=n
CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_X=55
CONFIG_NICE_OLED_WIDGET_LUNA_CUSTOM_Y=0
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS_LUNA=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS_LUNA=n

CONFIG_NICE_OLED_WIDGET_RAW_HID=n
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=n

CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=1000

# Peripheral animation comes from the zmk-peripheral-animations module
# (runtime-rendered): hand the widget slot over and disable the built-ins.
# Requires the module in the build workflow's modules list.
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n
CONFIG_NICE_OLED_EXTERNAL_WIDGET=y
CONFIG_ZMK_PANIM=y
CONFIG_ZMK_PANIM_EFFECT_STARFIELD=y
# nice-oled's BT/battery widgets occupy the left ~32px of the landscape
# screen: start right after them and run to the screen edge (33+94=127).
CONFIG_ZMK_PANIM_X=33
CONFIG_ZMK_PANIM_HEIGHT=94

CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=n
CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=n

CONFIG_LV_FONT_MONTSERRAT_14=n
CONFIG_LV_FONT_MONTSERRAT_22=n
